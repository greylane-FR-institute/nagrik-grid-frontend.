<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagrik Grid | Tactical Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #00ff00; font-family: monospace; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        #sidebar {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(10, 10, 10, 0.9); padding: 15px; border: 1px solid #333;
            border-radius: 5px; width: 350px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        h2 { margin: 0 0 15px 0; color: #ff3333; font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .incident { border-left: 3px solid #ff3333; padding-left: 10px; margin-bottom: 15px; font-size: 0.85em; color: #ccc;}
        .incident-meta { color: #888; font-size: 0.8em; margin-bottom: 8px;}
        .category-tag { color: #000; background: #ff3333; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #444; }
        
        /* Tactical Dark Popups */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(15, 15, 15, 0.95) !important;
            color: #00ff00 !important;
            border: 1px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
        }
        .leaflet-popup-content { font-family: monospace; font-size: 12px; }
        .leaflet-container a.leaflet-popup-close-button { color: #ff3333 !important; }

        /* Radar Pulse Animation */
        @keyframes radar-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>NAGRIK GRID // LIVE</h2>
        <div id="feed">Establishing secure connection to backend...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl: false}).setView([28.6139, 77.2090], 11);
        L.control.zoom({position: 'topright'}).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        const feedDiv = document.getElementById('feed');
        
        const colors = {
            'CROWD_HAZARD': '#ffaa00',
            'CIVIL_UNREST': '#ff3333',
            'VIP_PRESENCE': '#00bbff',
            'INFRA_FAILURE': '#aa00ff'
        };

        function addIncident(incident) {
            const color = colors[incident.category] || '#ffffff';
            
            const pulseIcon = L.divIcon({
                className: 'custom-pulse-icon',
                html: `<div style="background:${color}; width:12px; height:12px; border-radius:50%; position:relative; box-shadow: 0 0 8px ${color};">
                           <div style="background:${color}; width:100%; height:100%; border-radius:50%; position:absolute; top:0; left:0; animation: radar-pulse 1.5s ease-out infinite;"></div>
                       </div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            const marker = L.marker([incident.lat, incident.lng], {icon: pulseIcon}).addTo(map);
            marker.bindPopup(`<strong>${incident.category}</strong><br><br>${incident.description}`);

            const time = new Date(incident.ingested_at || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const entry = document.createElement('div');
            entry.className = 'incident';
            entry.style.borderLeftColor = color;
            entry.innerHTML = `
                <div class="incident-meta">[${time}] <span class="category-tag" style="background:${color}; color:#000;">${incident.category}</span></div>
                <div>${incident.description}</div>
            `;
            feedDiv.prepend(entry);
        }

        fetch('https://nagrik-grid-backend.onrender.com/api/incidents')
            .then(res => res.json())
            .then(data => {
                feedDiv.innerHTML = ''; 
                if(data.status === 'success' && data.data) {
                    data.data.forEach(inc => addIncident(inc));
                }
            }).catch(e => feedDiv.innerHTML = 'Error loading grid data.');

        const ws = new WebSocket('wss://nagrik-grid-backend.onrender.com/ws');
        ws.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            if (payload.event === 'new_incident' && payload.incident) {
                addIncident(payload.incident);
            }
        };
    </script>
</body>
</html>
